<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyServe Table #1 - Demo QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #064e3b 0%, #022c22 45%, #01140f 100%);
    }
    @media print {
      body {
        background: none;
      }
      .no-print {
        display: none;
      }
    }
  </style>
</head>
<body class="min-h-screen text-gray-900 flex flex-col items-center justify-center p-4 sm:p-8">

  <!-- Printable Table Tent Card -->
  <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden border border-amber-400/30">
    
    <!-- Top Header Banner -->
    <div class="bg-gradient-to-b from-emerald-950 to-emerald-900 text-white p-6 text-center relative">
      <div class="inline-flex items-center justify-center gap-2 px-3 py-1 rounded-full bg-amber-400/20 border border-amber-400/40 text-amber-300 text-xs font-bold uppercase tracking-wider mb-2">
        <span>✨ EasyServe Dine-In</span>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">Easy Serve Restaurant</h1>
      <div class="mt-2 inline-block bg-amber-400 text-emerald-950 text-sm font-black px-4 py-1 rounded-full shadow-md">
        TABLE #1
      </div>
    </div>

    <!-- QR Code Section -->
    <div class="p-6 text-center flex flex-col items-center">
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">
        Scan to View Menu & Order
      </p>

      <div class="p-3 bg-white rounded-2xl border-2 border-dashed border-amber-400/80 shadow-inner inline-block">
        <img
          src="/demo_table_1_qr.png"
          alt="EasyServe Demo Table #1 QR Code"
          class="w-56 h-56 rounded-lg object-contain"
        />
      </div>

      <div class="mt-4 flex items-center justify-center gap-1.5 text-xs text-emerald-800 font-semibold bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-1.5 w-full">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
        </svg>
        <span class="truncate">http://localhost:3000/restaurant/1?mode=dine-in&table=1</span>
      </div>

      <!-- Step by step instructions -->
      <div class="w-full mt-5 grid grid-cols-3 gap-2 text-center text-[11px]">
        <div class="bg-gray-50 rounded-xl p-2 border border-gray-100">
          <span class="block font-black text-amber-600 text-xs mb-0.5">1</span>
          <span class="text-gray-600 font-medium leading-tight">Scan with Camera</span>
        </div>
        <div class="bg-gray-50 rounded-xl p-2 border border-gray-100">
          <span class="block font-black text-amber-600 text-xs mb-0.5">2</span>
          <span class="text-gray-600 font-medium leading-tight">Pick Party Size</span>
        </div>
        <div class="bg-gray-50 rounded-xl p-2 border border-gray-100">
          <span class="block font-black text-amber-600 text-xs mb-0.5">3</span>
          <span class="text-gray-600 font-medium leading-tight">Order from Table</span>
        </div>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="bg-gray-50 border-t border-gray-100 px-6 py-3 text-center text-[11px] text-gray-400 font-medium">
      Powered by <strong class="text-emerald-900 font-bold">EasyServe</strong> Contactless Dining
    </div>
  </div>

  <!-- Print / Action Controls -->
  <div class="no-print mt-6 flex gap-3">
    <button onclick="window.print()" class="px-5 py-2.5 bg-amber-400 text-emerald-950 font-black text-xs rounded-xl shadow-lg hover:bg-amber-300 transition-all cursor-pointer">
      🖨️ Print Table Stand
    </button>
    <a href="/demo_table_1_qr.png" download="EasyServe_Table_1_QR.png" class="px-5 py-2.5 bg-emerald-900 border border-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg hover:bg-emerald-800 transition-all flex items-center gap-1.5">
      ⬇️ Download QR PNG
    </a>
  </div>

</body>
</html>
